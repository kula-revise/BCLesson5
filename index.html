<!DOCTYPE html>

<title>The Black Consciousness Movement · Build the Skeleton</title>
<style>

  /* ============================================================
     IDENTITY BLOCK. This is the ONLY block you edit per series.
     Everything below the block is the fixed mechanism and never changes.
     Two accents, split by job:
       --a1  accent one: navigation, progress, emphasis, option letters,
             the primary button, the story date. The "structure" accent.
       --a2  accent two: anything the learner earned. correct answers,
             the running summary, breakdown bars, key facts, the last
             story line. The "reward" accent.
     Set --a1-rgb / --a2-rgb to the SAME colours as r,g,b (no #), so the
     tints and shadows track the accents. One face for facts (serif),
     one for structure (sans). See README for how to design a new skin.
     ============================================================ */
  :root {
    /* Frank talk. Manila page, warm ink, umber and moss. */
    --sand: #16130E;   /* page background */
    --paper: #1E1A14;  /* cards */
    --cut: #262117;    /* insets, sources, carousels */
    --ink: #EFE7D8;    /* body text */
    --clay: #C49A6E;   /* stage tags, quiet labels */
    --fade: #9B9184;   /* muted text, captions */
    --a1: #C97B45;   --a1-rgb: 201,123,69;
    --a2: #82A06E;   --a2-rgb: 130,160,110;
    --serif: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, 'Times New Roman', serif;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }
body.bright{
  --sand: #EFE6D6;
  --paper: #FBF7EF;
  --cut: #FFFDF7;
  --ink: #1E1A15;
  --clay: #8A5A33;
  --fade: #635B50;
  --a1: #9A4E1E;
  --a1-rgb: 154,78,30;
  --a2: #4E6B45;
  --a2-rgb: 78,107,69;
}
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      repeating-linear-gradient(90deg, rgba(27,42,51,0.028) 0 1px, transparent 1px 5px),
      radial-gradient(ellipse at top right, rgba(var(--a1-rgb),0.10) 0%, transparent 58%),
      radial-gradient(ellipse at bottom left, rgba(var(--a2-rgb),0.09) 0%, transparent 58%),
      var(--sand);
    padding: 1.6rem 1rem 3rem;
    font-family: var(--serif);
    color: var(--ink); line-height: 1.6; -webkit-text-size-adjust: 100%;
    -webkit-user-select: none; user-select: none;
  }
  .container { max-width: 720px; margin: 0 auto; }
  .top-bar { margin-bottom: 1.6rem; }
  .top-meta { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--a2); font-weight: 700; margin-bottom: 0.55rem; gap: 1rem; flex-wrap: wrap; }
  .top-count { color: var(--fade); font-weight: 500; letter-spacing: 0.04em; text-transform: none; }
  .track { height: 3px; background: rgba(27,42,51,0.12); overflow: hidden; }
  .fill { height: 100%; background: var(--a1); transition: width 0.35s ease; width: 0%; }

  /* Cover */
  .cover { text-align: center; padding: 1.2rem 0 1rem; }
  .cover-eyebrow { font-family: var(--sans); font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--clay); font-weight: 700; margin-bottom: 1.4rem; }
  .cover-title { font-size: clamp(2.3rem,7vw,3.6rem); font-weight: 800; line-height: 1.03; letter-spacing: -0.025em; margin-bottom: 1.3rem; }
  .flourish { width: 92px; height: 9px; margin: 0 auto 1.6rem;
    background:
      radial-gradient(circle at 9px 4.5px, var(--a1) 0 4px, transparent 4.5px),
      radial-gradient(circle at 46px 4.5px, var(--a1) 0 4px, transparent 4.5px),
      radial-gradient(circle at 83px 4.5px, var(--a1) 0 4px, transparent 4.5px); }
  .cover-line { font-size: 1.16rem; line-height: 1.7; color: var(--ink); font-style: italic; max-width: 30rem; margin: 0 auto 2rem; min-height: 5.5rem; }
  .cover-line span { opacity: 0; transition: opacity 0.5s ease; }
  .cover-line span.vis { opacity: 1; }
  .cover-time { font-family: var(--sans); font-size: 0.8rem; color: var(--fade); margin-top: 1.4rem; letter-spacing: 0.02em; }
  .btn-begin { font-family: var(--sans); display: inline-flex; align-items: center; gap: 0.8rem; padding: 1.05rem 2.2rem; background: var(--ink); color: #F4EADA; border: none; cursor: pointer; font-size: 1.12rem; font-weight: 700; }
  .btn-begin:hover { background: #12202a; }
  .btn-begin .sa { color: var(--paper); font-size: 1.3rem; }
  .skip-link { display: block; margin: 1.6rem auto 0; background: transparent; border: none; color: var(--fade); font-family: var(--sans); font-size: 0.84rem; cursor: pointer; text-decoration: underline; }

  /* Story hook */
  .story { padding: 0.6rem 0 0.4rem; min-height: 60vh; display: flex; flex-direction: column; justify-content: center; }
  .story-num { font-family: var(--serif); font-size: clamp(2.6rem,9vw,4rem); font-weight: 800; color: var(--a1); line-height: 1; letter-spacing: -0.02em; }
  .story-unit { font-family: var(--sans); font-size: 0.82rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fade); font-weight: 700; margin-top: 0.5rem; }
  .story-rule { width: 100%; height: 1px; background: rgba(27,42,51,0.22); margin: 1.4rem 0 1.6rem; }
  .story-line { font-size: 1.24rem; line-height: 1.66; margin-bottom: 1.05rem; opacity: 0; transform: translateY(6px); transition: opacity 0.55s ease, transform 0.55s ease; }
  .story-line.vis { opacity: 1; transform: translateY(0); }
  .story-line.last { color: var(--a2); font-style: italic; font-weight: 600; }

  /* Content cards */
  .card { background: var(--paper); border: 1px solid rgba(27,42,51,0.12); border-left: 5px solid var(--a1); padding: 1.7rem 1.5rem; margin-bottom: 1.3rem; }

  .card h2 { font-family: var(--sans); font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 0.9rem; }
  .card p { font-size: 1.04rem; line-height: 1.74; margin-bottom: 0.9rem; }
  .card p:last-child { margin-bottom: 0; }
  .key { color: var(--a2); font-weight: 700; }        /* one emphasis colour, body face kept */
  .card strong { color: var(--a2); font-weight: 700; }
  .pull { border-left: 4px solid var(--a2); padding: 0.15rem 0 0.15rem 1rem; font-weight: 600; color: var(--ink); margin: 1.15rem 0; font-style: italic; }
  .figure { margin: 1rem 0 0.3rem; }
  .figure img { display: block; height: auto; border: 1px solid rgba(27,42,51,0.18); margin: 0 auto; }
  .figure.wide img { width: 100%; max-width: 460px; }
  .figure.portrait img { width: 100%; max-width: 320px; }
  .figure figcaption { font-family: var(--serif); font-size: 0.82rem; color: var(--fade); margin-top: 0.5rem; line-height: 1.55; text-align: center; }

  /* Carousel */
  .car-wrap { margin: 0.4rem 0 0; }

  .car-card { font-size: 1.06rem; line-height: 1.7; width: 100%; }
  .car-card .cc-lead { font-family: var(--sans); font-weight: 700; font-size: 0.95rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--clay); display: block; margin-bottom: 0.5rem; }
  .car-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 0.9rem; gap: 1rem; }

  .car-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(27,42,51,0.2); }
  .car-dot.read { background: var(--a2); }
  .car-dot.here { outline: 2px solid var(--a1); outline-offset: 2px; }
  .car-count { font-family: var(--sans); font-size: 0.78rem; color: var(--fade); font-weight: 600; }
  .car-btns { display: flex; gap: 0.5rem; }
  .car-btn { font-family: var(--sans); width: 2.4rem; height: 2.4rem; background: var(--paper); border: 1px solid rgba(27,42,51,0.28); color: var(--ink); font-size: 1.1rem; cursor: pointer; }
  .car-btn:disabled { opacity: 0.32; cursor: not-allowed; }

  /* Stat strip */
  .stat-strip { display: grid; grid-template-columns: repeat(auto-fit,minmax(120px,1fr)); gap: 0.8rem; margin: 0.5rem 0 0.2rem; }
  .stat { background: var(--cut); border: 1px solid rgba(27,42,51,0.12); border-top: 3px solid var(--a2); padding: 1.1rem 0.7rem; text-align: center; }
  .stat-num { font-family: var(--serif); font-size: 2rem; font-weight: 800; color: var(--a2); line-height: 1; letter-spacing: -0.02em; }
  .stat-label { font-family: var(--sans); font-size: 0.72rem; letter-spacing: 0.06em; color: var(--fade); margin-top: 0.5rem; line-height: 1.4; }

  /* Key terms + memory boxes (collapsed) */
  /* Key terms strip: label + individual expandable chips */
  .kt { margin-top: 1.3rem; }
  .kt-label { font-family: var(--sans); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--a1); padding-top: 0.85rem; border-top: 1px dashed rgba(var(--a1-rgb),0.4); }
  .kt-row { display: flex; flex-wrap: wrap; gap: 0.55rem; margin-top: 0.85rem; }
  .kt-term { border: 1px solid rgba(27,42,51,0.24); background: transparent; }
  .kt-term summary { font-family: var(--sans); font-size: 0.92rem; font-weight: 600; color: var(--ink); cursor: pointer; list-style: none; padding: 0.55rem 0.85rem; display: inline-flex; align-items: center; gap: 0.5rem; }
  .kt-term summary::-webkit-details-marker { display: none; }
  .kt-term summary::after { content: "+"; color: var(--a1); font-weight: 800; font-size: 1.05rem; }
  .kt-term[open] { display: block; width: 100%; }
  .kt-term[open] summary::after { content: "\2212"; }
  .kt-def { font-size: 0.94rem; line-height: 1.62; color: var(--ink); padding: 0 0.85rem 0.75rem; }

  /* Remember box (collapsed) */
  .remember { margin-top: 0.9rem; border-top: 1px dashed rgba(var(--a1-rgb),0.4); padding-top: 0.7rem; }
  .remember summary { font-family: var(--sans); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; color: var(--a1); cursor: pointer; list-style: none; }
  .remember summary::-webkit-details-marker { display: none; }
  .remember summary::before { content: "+ "; font-weight: 800; }
  .remember[open] summary::before { content: "\2212 "; }
  .remember .disc-body { font-size: 0.96rem; line-height: 1.68; color: var(--ink); margin-top: 0.6rem; background: rgba(var(--a2-rgb),0.06); border-left: 3px solid var(--a2); padding: 0.7rem 0.9rem; }

  /* Sources */
  .source { position: relative; background: var(--cut); border: 1px solid rgba(27,42,51,0.12); border-top: 3px solid var(--a2); box-shadow: 6px 6px 0 rgba(var(--a2-rgb),0.13); padding: 1.2rem 1.3rem; margin: 1.15rem 0 1.6rem; }
  .source-attr { font-family: var(--sans); font-size: 0.8rem; color: var(--clay); font-weight: 600; margin-bottom: 0.75rem; line-height: 1.5; }
  .source-body { font-size: 1.02rem; line-height: 1.74; }
  .source-body em { color: var(--a2); font-style: italic; }
  .toggle-btn { font-family: var(--sans); background: transparent; border: none; color: var(--a1); cursor: pointer; font-size: 0.88rem; font-weight: 600; text-decoration: underline; padding: 0.7rem 0 0; }
  .toggle-body { display: none; margin-top: 0.7rem; padding-top: 0.7rem; border-top: 1px dashed rgba(123,114,99,0.45); font-size: 0.94rem; color: var(--ink); line-height: 1.66; }
  .toggle-body.open { display: block; }

  /* Questions */
  .q-text { font-size: 1.16rem; line-height: 1.5; font-weight: 600; margin-bottom: 1.2rem; }
  .options { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.2rem; }
  .option { display: flex; align-items: flex-start; gap: 0.85rem; padding: 1rem 1.05rem; background: var(--sand); border: 1px solid rgba(27,42,51,0.13); cursor: pointer; font-family: var(--serif); text-align: left; font-size: 0.99rem; line-height: 1.55; color: var(--ink); width: 100%; }
  .option:hover:not(:disabled) { background: var(--cut); border-color: var(--a1); }

  .option.selected { background: var(--cut); border-color: var(--a1); border-width: 2px; padding: 0.94rem 0.99rem; }
  .option.correct { background: rgba(130,160,110,0.22); border-color: var(--a2); border-width: 2px; padding: 0.94rem 0.99rem; }

  .expl-label { font-family: var(--sans); font-size: 0.66rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--a2); font-weight: 700; margin-bottom: 0.5rem; }
  .expl-text { line-height: 1.7; font-size: 0.96rem; }
  .chip { display: inline-block; font-family: var(--sans); padding: 0.22rem 0.65rem; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .chip-argue { background: #E7D6C4; color: #7B3F1C; }
  .chip-evidence { background: #E7D6C4; color: #7B3F1C; }
  .chip-weigh { background: var(--a2); color: #F0E3CF; }
  .chip-instinct { background: #EADFC9; color: #8A5A33; }
  .q-meta { margin-bottom: 0.9rem; }

  /* order + sort interactions */
  .inter { margin: 0.4rem 0 1rem; }
  .inter-pool { display: flex; flex-direction: column; gap: 0.5rem; }
  .inter-item { font-family: var(--serif); text-align: left; padding: 0.85rem 1rem; background: var(--sand); border: 1px solid rgba(27,42,51,0.16); cursor: pointer; font-size: 0.97rem; line-height: 1.5; color: var(--ink); display: flex; gap: 0.7rem; align-items: baseline; }
  .inter-item:hover:not(:disabled) { border-color: var(--a1); background: var(--cut); }
  .inter-item .rank { font-family: var(--sans); font-weight: 800; color: var(--a1); min-width: 1.4rem; }
  .inter-placed { background: var(--cut); border-color: var(--a2); }

  .sort-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  .sort-col { background: rgba(255,255,255,0.4); border: 1px dashed rgba(27,42,51,0.28); padding: 0.7rem; min-height: 4rem; }
  .sort-col h4 { font-family: var(--sans); font-size: 0.76rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--clay); font-weight: 700; margin-bottom: 0.6rem; text-align: center; }
  .sort-btns { display: flex; gap: 0.4rem; margin-top: 0.5rem; }

  /* Running summary */

  .runsum-label { font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--a2); font-weight: 700; margin-bottom: 0.9rem; }

  /* Popup */
  .pop-back { position: fixed; inset: 0; background: rgba(27,42,51,0.5); display: flex; align-items: center; justify-content: center; padding: 1.5rem; z-index: 50; }
  .pop { background: var(--paper); border-top: 5px solid var(--a2); padding: 1.6rem 1.5rem; max-width: 30rem; width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
  .pop-label { font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--a2); font-weight: 700; margin-bottom: 0.8rem; }

  /* Results */
  .results-head { text-align: center; margin-bottom: 1.8rem; }

  .results-actions { display: flex; gap: 0.8rem; margin-top: 1.6rem; }
  .results-actions button { flex: 1; }
  .hidden { display: none !important; }

body:not(.bright) .btn-primary, body:not(.bright) #next-btn { color: #16130e !important; }
body:not(.bright) .btn-primary .sa, body:not(.bright) #next-btn .sa, body:not(.bright) .btn-primary svg, body:not(.bright) #next-btn svg { color: #16130e !important; fill: #16130e !important; }

.container{max-width:720px;margin:0 auto;padding:1.2rem 1.1rem 3rem;}
.cap-intro{font-size:1.04rem;line-height:1.74;margin-bottom:1.1rem;}
.yourpoint{background:var(--cut);border-left:4px solid var(--a1);padding:0.8rem 0.95rem;margin-bottom:1.1rem;font-family:var(--serif);font-size:1rem;line-height:1.5;}
.yourpoint b{display:block;font-family:var(--sans);font-size:0.62rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--a1);font-weight:700;margin-bottom:0.3rem;}
.evlist{display:flex;flex-direction:column;gap:0.6rem;margin-bottom:1.2rem;}
.evrow{display:flex;align-items:center;gap:0.85rem;padding:0.85rem 1rem;background:var(--sand);border-left:3px solid transparent;}
.evrow .evtext{flex:1;font-family:var(--serif);font-size:1rem;line-height:1.55;}
.evrow .evtext .off{display:block;font-family:var(--sans);font-size:0.78rem;color:var(--fade);margin-top:0.2rem;}
.evtoggle{font-family:var(--sans);font-size:0.78rem;font-weight:700;border:1px solid var(--a1);color:var(--a1);background:transparent;padding:0.4rem 0.85rem;cursor:pointer;min-height:38px;white-space:nowrap;}
.evrow.use{border-left-color:var(--a1);background:var(--cut);}
.evrow.use .evtoggle{background:var(--a1);color:#F7F1E4;border-color:var(--a1);}
.evrow.ok{border-left-color:var(--a2);border-left-width:4px;background:var(--cut);}
.evrow.miss{border-left:3px dashed var(--a2);}
.evrow.wrong{border-left-color:var(--clay);border-left-width:4px;background:var(--cut);}
.evtag{font-family:var(--sans);font-size:0.7rem;font-weight:700;letter-spacing:0.08em;}
.evtag.y{color:var(--a2);} .evtag.n{color:var(--fade);}
.frame{background:var(--cut);border-left:5px solid var(--a1);padding:1.2rem 1.3rem;margin-bottom:1.2rem;}
.frame .fp{padding:0.7rem 0 0.95rem;border-bottom:1px dashed rgba(var(--a1-rgb),0.28);}
.frame .fp:last-child{border-bottom:none;padding-bottom:0;}
.frame .frole{font-family:var(--sans);font-size:0.62rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--a1);font-weight:700;margin-bottom:0.3rem;}
.frame .fts{font-family:var(--serif);font-weight:700;font-size:1.02rem;line-height:1.5;margin-bottom:0.5rem;}
.frame .flabel{font-family:var(--sans);font-size:0.66rem;font-weight:700;color:var(--fade);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:0.2rem;}
.frame ul{margin:0.1rem 0 0.6rem;padding-left:1.15rem;}
.frame li{font-family:var(--serif);margin-bottom:0.25rem;line-height:1.5;}
.frame .flink{font-family:var(--serif);font-style:italic;color:var(--fade);}
.writeup{font-family:var(--sans);background:var(--sand);border-left:5px solid var(--a2);padding:1.1rem 1.2rem;}
.writeup b{color:var(--a2);font-size:1.05rem;}
.writeup .wsub{font-size:0.92rem;line-height:1.6;color:var(--fade);margin-top:0.4rem;}
.cap-prog{font-family:var(--sans);font-size:0.66rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--fade);font-weight:700;margin-bottom:0.9rem;}
.cap-actions{display:flex;justify-content:flex-end;}
/* bc light-mode: Begin arrow readable on the dark inverted button */
    body.bright .btn-begin .sa { color: var(--paper) !important; }


    #kula-mode-toggle{position:fixed;bottom:1.1rem;right:1.1rem;z-index:9999;display:inline-flex;align-items:center;gap:.45em;padding:.48rem .82rem;border-radius:999px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;background:#1E1A14;color:#9B9184;border:1px solid rgba(239,231,216,0.16);}
    body.bright #kula-mode-toggle{background:#EFE6D6;color:#4A4339;border-color:rgba(30,26,21,0.15);}
</style>
<style>/* kula: contrast corrections. Measured on the painted result in both modes, on every surface the control appears on. Colour only. */
body:not(.bright) .evrow.use .evtoggle { background-color: #98582C !important; }
</style>
</head>
<body class="bright">
<script>/* kula: LMS embed events. "completed" fires once, when the learner reaches the closing screen. "advance" fires from the final button. */
(function(){var sentCompleted=false;window.kulaEmbed=function(ev){if(ev==="completed"){if(sentCompleted)return;sentCompleted=true;}try{window.parent.postMessage({type:"lms-embed-event",version:"1.0",payload:{event:ev}},"*");}catch(e){}};})();</script>
<button id="kula-mode-toggle" type="button" onclick="kulaToggle()" aria-label="Switch between light and dark mode"><span id="kmt-icon"></span><span id="kmt-label"></span></button>
<div class="container"><div id="stage"></div></div>
<script>
(function(){var MOON="<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z'/></svg>",SUN="<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='4.2'/><path d='M12 1.6v2M12 20.4v2M3.6 12h-2M22.4 12h-2M5.6 5.6 4.2 4.2M19.8 19.8l-1.4-1.4M18.4 5.6l1.4-1.4M4.2 19.8l1.4-1.4'/></svg>",K="kula-theme-2";function paint(){var d=!document.body.classList.contains("bright");var ic=document.getElementById("kmt-icon"),la=document.getElementById("kmt-label");if(ic)ic.innerHTML=d?SUN:MOON;if(la)la.textContent=d?"Light mode":"Dark mode"}window.kulaToggle=function(){document.body.classList.toggle("bright");try{localStorage.setItem(K,document.body.classList.contains("bright")?"light":"dark")}catch(e){}paint()};try{if(localStorage.getItem(K)==="dark")document.body.classList.remove("bright")}catch(e){}paint();})();
var esc=function(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;};
var frame={}, idx=0;

var COVER={
  eyebrow:"Kula Revise \u00b7 Grade 12 History \u00b7 The Black Consciousness Movement",
  title:"Build the Skeleton",
  lines:["Fifty marks. One hour. Three pages.","You will not write the essay here.","You build its skeleton: the line, the points, the evidence, the verdict.","Then you take the frame away and write it in your own words."]
};

var STEPS=[
  {type:'cover'},
  {type:'pick', tag:'Introduction \u00b7 your line of argument', prog:'Line of argument',
    h2:'Choose your line of argument',
    intro:'The statement says political liberation was the only thing the movement wanted. The command word is critically discuss, so you have to take a side and later weigh the other one. Pick the sentence that argues, not the one that only describes.',
    correct:0,
    opts:[
      "Political liberation was one focus of the movement, but it was never the only one: it also worked for psychological, economic and social liberation.",
      "The Black Consciousness Movement was active between 1968 and 1977 and involved many people, ideas and organisations.",
      "Political liberation was the only thing the Black Consciousness Movement ever cared about."
    ],
    expl:"<b>The first sentence argues.</b> It takes a side against the statement and names the ground you will cover, so the essay has a line to follow. The second only describes: a marker sees you telling the story, not making a case, and that caps you at middle marks. The third simply agrees with the statement, and the evidence will go against it.",
    save:function(s){frame.arg=s.opts[0];}},

  {type:'pick', tag:'Body 1 \u00b7 psychological liberation', prog:'Body 1 of 3 \u00b7 claim',
    h2:'Body paragraph 1: the topic sentence',
    intro:'Your first body paragraph is the movement\u2019s most distinctive work: freeing the mind. Every paragraph opens with a claim that pushes your line forward. Pick the topic sentence that takes a clear position.',
    correct:0,
    opts:[
      "The movement\u2019s most distinctive work was psychological.",
      "The movement had a psychological side and did various things about it.",
      "The movement thought the mind did not matter, only the law did."
    ],
    expl:"<b>The first states a position your evidence can hold.</b> The second only says a psychological side existed, without arguing it mattered most. The third takes the wrong line: Biko put the mind first, so you would be arguing against your own evidence.",
    save:function(s){frame.b1ts=s.opts[0];}},
  {type:'evidence', tag:'Body 1 \u00b7 psychological liberation', prog:'Body 1 of 3 \u00b7 evidence',
    h2:'Now choose the evidence',
    ts:"The movement\u2019s most distinctive work was psychological.",
    intro:'A claim is only worth the evidence under it. Tap Use it for the facts that back this point about freeing the mind. Leave out the real facts that belong to a different paragraph.',
    items:[
      {t:"Biko argued apartheid had taught black South Africans to see themselves as inferior", use:true},
      {t:"Liberation had to begin in the mind", use:true},
      {t:"It set out to instil self-respect, pride and self-reliance", use:true},
      {t:"It rejected the word non-white in favour of black", use:true},
      {t:"The movement built the Zanempilo clinic", use:false, off:"that is social liberation, the next paragraph"},
      {t:"Students in Soweto rose on 16 June 1976", use:false, off:"that belongs to the counter-argument"}
    ],
    expl:"<b>The four facts about the mind back this point.</b> The clinic and the Soweto rising are real and important, but each belongs in a different paragraph.",
    link:"Freeing the mind came first, and the rest of the movement\u2019s work grew from it.",
    save:function(s){frame.b1ev=s.chosen; frame.b1link=s.link;}},

  {type:'pick', tag:'Body 2 \u00b7 economic and social liberation', prog:'Body 2 of 3 \u00b7 claim',
    h2:'Body paragraph 2: the topic sentence',
    intro:'Your second body paragraph shows the movement acting in the world, not just in the mind: work, health and schooling run by black communities. Pick the topic sentence that takes a clear position.',
    correct:0,
    opts:[
      "The movement worked for economic and social liberation too, not only political.",
      "The movement did a number of economic and social things.",
      "The movement left economic and social life completely alone."
    ],
    expl:"<b>The first takes a side:</b> it names economic and social liberation as real aims. The second only describes. The third takes the wrong line, and the community programmes and unions are the evidence against it.",
    save:function(s){frame.b2ts=s.opts[0];}},
  {type:'evidence', tag:'Body 2 \u00b7 economic and social liberation', prog:'Body 2 of 3 \u00b7 evidence',
    h2:'Now choose the evidence',
    ts:"The movement worked for economic and social liberation too, not only political.",
    intro:'Same job again: tap Use it for the facts that prove this point about work and community programmes. Leave out the ones that belong to another paragraph.',
    items:[
      {t:"The Black Allied Workers\u2019 Union formed in 1973", use:true},
      {t:"The Black Community Programmes built the Zanempilo clinic", use:true},
      {t:"The Ginsburg Educational Trust and the winter schools", use:true},
      {t:"None of it depended on white help", use:true},
      {t:"Biko argued liberation had to begin in the mind", use:false, off:"that is the psychological point, paragraph one"},
      {t:"The state banned seventeen organisations in 1977", use:false, off:"that belongs to the counter-argument"}
    ],
    expl:"<b>The four facts about work and community programmes build this point.</b> The point about the mind is paragraph one, and the 1977 bannings belong in the counter-argument. Match every fact to the claim it supports before you write it down.",
    link:"This was self-reliance put into practice, run by black communities for themselves.",
    save:function(s){frame.b2ev=s.chosen; frame.b2link=s.link;}},

  {type:'pick', tag:'Body 3 \u00b7 counter-argument', prog:'Body 3 of 3 \u00b7 claim',
    h2:'Body paragraph 3: the other side',
    intro:'Critically discuss means you must weigh the other side before you decide. Pick the topic sentence that states the opposing case fairly.',
    correct:0,
    opts:[
      "It can be argued that the political was always the real point.",
      "There were some political sides to the movement as well.",
      "The movement had nothing to do with politics at any point."
    ],
    expl:"<b>The first states the other side fairly,</b> which is what the counter-argument step needs. The second raises an objection too soft to be worth answering. The third denies the political side existed, so there is nothing to weigh.",
    save:function(s){frame.c1ts=s.opts[0];}},
  {type:'evidence', tag:'Body 3 \u00b7 counter-argument', prog:'Body 3 of 3 \u00b7 evidence',
    h2:'The evidence for the other side',
    ts:"It can be argued that the political was always the real point.",
    intro:'Here you gather the strongest facts for the opposing case. Tap Use it for the ones that point to politics. Leave out the community work: it cannot make the case that politics was the only point.',
    items:[
      {t:"Ideas reached the schools through SASM", use:true},
      {t:"Students in Soweto rejected Afrikaans, then the system, on 16 June 1976", use:true},
      {t:"The state banned seventeen organisations in 1977", use:true},
      {t:"The Zanempilo clinic served black communities", use:false, off:"community work, not a political point"},
      {t:"Biko called for self-respect and pride", use:false, off:"the psychological point, not a political one"}
    ],
    expl:"<b>These three facts put the opposing case at its most convincing.</b> The clinic and the call for pride are the movement\u2019s own work, so they cannot show that politics was the only aim. Then you rebut: the bannings show the state\u2019s judgement, not the movement\u2019s aims, and the mind came first in everything it did.",
    link:"But the bannings show the state\u2019s judgement, not the movement\u2019s aims, and the mind came first in all its work.",
    save:function(s){frame.c1ev=s.chosen; frame.c1link=s.link;}},

  {type:'pick', tag:'Conclusion \u00b7 the verdict', prog:'Verdict',
    h2:'Land your verdict',
    intro:'A conclusion weighs both sides and still decides. Pick the verdict that does both. Avoid the absolute one and the one that sits on the fence.',
    correct:0,
    opts:[
      "Political liberation was therefore one focus, but not the only one: the movement pursued psychological, economic and social liberation at the same time, with the political resting on the psychological.",
      "The movement cared only about freeing the mind and never about politics at all.",
      "The movement did lots of different things, so it is hard to say what it was really about."
    ],
    expl:"<b>The first weighs both sides and still gives an answer.</b> It answers the statement directly, names the other aims, and reaches a judgement the essay has earned. The second admits no limits. The third avoids deciding. Listing many things without deciding wastes your conclusion.",
    save:function(s){frame.verdict=s.opts[0];}},

  {type:'frame'}
];

var stage=document.getElementById('stage');
function next(){ idx++; render(); window.scrollTo(0,0); }
function render(){
  var s=STEPS[idx];
  if(s.type==='cover') return renderCover();
  if(s.type==='pick') return renderPick(s);
  if(s.type==='evidence') return renderEvidence(s);
  if(s.type==='frame') return renderFrame();
}
function prog(s){ return s.prog?('<div class="cap-prog">Step '+idx+' of '+(STEPS.length-2)+' \u00b7 '+s.prog+'</div>'):''; }

function renderCover(){
  var lines=COVER.lines.map(function(l){return '<span>'+esc(l)+'</span>';}).join('<br>');
  stage.innerHTML='<div class="cover"><div class="cover-eyebrow">'+COVER.eyebrow+'</div>'+
    '<h1 class="cover-title">'+esc(COVER.title)+'</h1><div class="flourish"></div>'+
    '<div class="cover-line" id="cover-line">'+lines+'</div>'+
    '<button class="btn-begin" id="begin-btn">Begin <span class="sa">&rarr;</span></button></div>';
  var sp=[].slice.call(document.querySelectorAll('#cover-line span'));
  sp.forEach(function(x,i){setTimeout(function(){x.classList.add('vis');}, 300+i*450);});
  document.getElementById('begin-btn').onclick=next;
}

function renderPick(s){
  var chosen=null;
  function draw(){
    var opts=s.opts.map(function(o,i){
      var cls='option', mark='';
      if(chosen!==null){ cls+=' selected'; if(i===s.correct){cls+=' correct'; mark='<span class="opt-mark">&#10003;</span>';} else if(i===chosen){cls+=' wrong'; mark='<span class="opt-mark">&#10007;</span>';} else {cls+=' dimmed';} }
      return '<button class="'+cls+'" data-i="'+i+'"'+(chosen!==null?' disabled':'')+'><span class="opt-letter">'+String.fromCharCode(65+i)+'</span><span class="opt-text">'+esc(o)+'</span>'+mark+'</button>';
    }).join('');
    var tail = chosen!==null ? '<div class="explanation"><div class="expl-label">Why</div><div class="expl-text">'+s.expl+'</div></div><div class="cap-actions" style="margin-top:1.2rem"><button class="btn-primary" id="cont">Continue</button></div>' : '';
    stage.innerHTML=prog(s)+'<div class="card"><div class="stage-tag">'+s.tag+'</div><h2>'+esc(s.h2)+'</h2><p class="cap-intro">'+s.intro+'</p><div class="options">'+opts+'</div>'+tail+'</div>';
    if(chosen===null){ [].forEach.call(document.querySelectorAll('.option'),function(b){ b.onclick=function(){ chosen=+b.getAttribute('data-i'); draw(); }; }); }
    else { document.getElementById('cont').onclick=function(){ s.save(s); next(); }; }
  }
  draw();
}

function renderEvidence(s){
  var done=false, state={};
  function draw(){
    var rows=s.items.map(function(it,i){
      var cls='evrow', right='';
      if(state[i]&&!done) cls+=' use';
      if(done){ var u=!!state[i]; if(it.use&&u){cls+=' ok';right='<span class="evtag y">USE</span>';} else if(it.use&&!u){cls+=' miss';right='<span class="evtag y">USE</span>';} else if(!it.use&&u){cls+=' wrong';right='<span class="evtag n">LEAVE OUT</span>';} else {right='<span class="evtag n">LEAVE OUT</span>';} }
      var off = (done&&it.off)?'<span class="off">'+esc(it.off)+'</span>':'';
      var ctrl = done ? right : '<button class="evtoggle" data-i="'+i+'">'+(state[i]?'Using \u2713':'Use it')+'</button>';
      return '<div class="'+cls+'"><span class="evtext">'+esc(it.t)+off+'</span>'+ctrl+'</div>';
    }).join('');
    var foot;
    if(!done) foot='<div class="cap-actions"><button class="btn-primary" id="chk" disabled>Check my selection</button></div>';
    else foot='<div class="explanation"><div class="expl-label">Why</div><div class="expl-text">'+s.expl+'</div></div><div class="cap-actions" style="margin-top:1.2rem"><button class="btn-primary" id="cont">Continue</button></div>';
    stage.innerHTML=prog(s)+'<div class="card"><div class="stage-tag">'+s.tag+'</div><h2>'+esc(s.h2)+'</h2>'+
      '<div class="yourpoint"><b>Your point</b>'+esc(s.ts)+'</div><p class="cap-intro">'+s.intro+'</p><div class="evlist">'+rows+'</div>'+foot+'</div>';
    if(!done){
      [].forEach.call(document.querySelectorAll('.evtoggle'),function(b){ b.onclick=function(){ var i=+b.getAttribute('data-i'); state[i]=!state[i]; draw(); }; });
      document.getElementById('chk').disabled=Object.keys(state).filter(function(k){return state[k];}).length===0;
      document.getElementById('chk').onclick=function(){ done=true; draw(); };
    } else {
      s.chosen=s.items.filter(function(x,i){return state[i]&&x.use;}).map(function(x){return x.t;});
      if(s.chosen.length===0) s.chosen=s.items.filter(function(x){return x.use;}).map(function(x){return x.t;});
      document.getElementById('cont').onclick=function(){ s.save(s); next(); };
    }
  }
  draw();
}

function renderFrame(){
  function ul(a){return '<ul>'+(a||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';}
  var f='<div class="fp"><div class="frole">Line of argument</div><div class="fts">'+esc(frame.arg)+'</div></div>'+
    '<div class="fp"><div class="frole">Body 1 \u00b7 psychological liberation</div><div class="fts">'+esc(frame.b1ts)+'</div><div class="flabel">Evidence</div>'+ul(frame.b1ev)+'<div class="flink">Link: '+esc(frame.b1link)+'</div></div>'+
    '<div class="fp"><div class="frole">Body 2 \u00b7 economic and social liberation</div><div class="fts">'+esc(frame.b2ts)+'</div><div class="flabel">Evidence</div>'+ul(frame.b2ev)+'<div class="flink">Link: '+esc(frame.b2link)+'</div></div>'+
    '<div class="fp"><div class="frole">Body 3 \u00b7 counter-argument</div><div class="fts">'+esc(frame.c1ts)+'</div><div class="flabel">Evidence for the other side</div>'+ul(frame.c1ev)+'<div class="flink">Rebuttal: '+esc(frame.c1link)+'</div></div>'+
    '<div class="fp"><div class="frole">Verdict</div><div class="fts">'+esc(frame.verdict)+'</div></div>';
  stage.innerHTML='<div class="card"><div class="stage-tag">Your writing frame</div><h2>Take this away and write it up</h2>'+
    '<p class="cap-intro">This is the shape of a top essay: a clear line, three paragraphs each with a claim and its evidence, and a verdict that decides. You built every choice in it.</p>'+
    '<div class="frame">'+f+'</div>'+
    '<div class="writeup"><b>Now write the essay in full, in your own words.</b><div class="wsub">The frame gives you the shape and the facts. Turning these notes into full sentences, in the exam, is the part only you can do.</div></div><div class="cap-actions" style="margin-top:1.4rem"><button class="btn-primary" id="cap-advance">Continue to What Stuck&nbsp;&rarr;</button></div></div>';
  document.getElementById('cap-advance').onclick=function(){ kulaEmbed('advance'); };
  kulaEmbed('completed');
}

render();
</script>
</body>
</html>
